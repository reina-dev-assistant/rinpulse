plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.joyodigitama.huaweiwear'
version = '0.1.0'

// "play" for Google Play builds (JOYOFIT_DISTRIBUTION=play or -PjoyofitDistribution=play), "sideload" otherwise.
// Play builds drop SEND_SMS, READ_CALL_LOG and READ_CONTACTS (src/play/AndroidManifest.xml) and the code that needs them
// switches itself off (Distribution.kt).
def joyofitDistribution = (findProperty('joyofitDistribution') ?: System.getenv('JOYOFIT_DISTRIBUTION') ?: 'sideload').toString().toLowerCase()
if (!(joyofitDistribution in ['play', 'sideload'])) {
  throw new GradleException("JOYOFIT_DISTRIBUTION must be 'play' or 'sideload', got '${joyofitDistribution}'")
}

android {
  namespace "com.joyodigitama.huaweiwear"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "DISTRIBUTION", "\"${joyofitDistribution}\""
  }
  buildFeatures {
    buildConfig true
  }
  sourceSets {
    if (joyofitDistribution == 'play') {
      debug.manifest.srcFile 'src/play/AndroidManifest.xml'
      release.manifest.srcFile 'src/play/AndroidManifest.xml'
    }
    main {
      // The shared database migrations (also imported by src/db/migrations.ts) ship as an asset.
      assets.srcDirs += file('../schema')
    }
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

apply from: '../../newapi-lint.gradle'

dependencies {
  implementation 'org.slf4j:slf4j-api:2.0.17'
  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'androidx.health.connect:connect-client:1.1.0'
  // AES-256 encrypted ZIP (the Huawei Privacy Centre export); Apache-2.0.
  implementation 'net.lingala.zip4j:zip4j:2.11.5'
  testImplementation 'junit:junit:4.13.2'
  // android.jar ships org.json as stubs; JVM unit tests need the real implementation.
  testImplementation 'org.json:json:20250517'
  // A real SQLite on the JVM: the multi-watch write rules run against the shipped schema (MultiWatchSqlTest). Test classpath only.
  testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}