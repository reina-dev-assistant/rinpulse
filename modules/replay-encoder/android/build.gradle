plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.joyodigitama.replayencoder'
version = '0.1.0'

android {
  namespace "com.joyodigitama.replayencoder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

apply from: '../../newapi-lint.gradle'

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
